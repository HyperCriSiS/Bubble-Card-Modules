name: Sync Bubble Card upstream reference

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Only this workflow may write the verified upstream reference. The modules
# themselves remain untouched, and no pull-request approval is required.
permissions:
  contents: write

concurrency:
  group: bubble-card-upstream-reference
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main with write credentials for the final commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true

      - name: Test reference synchronizer
        run: python3 -m unittest discover -s tests -p 'test_bubble_card_reference.py' -v

      - name: Refresh stable and main snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_bubble_card_reference.py

      - name: Verify all mirrored Git blob hashes
        run: python3 scripts/sync_bubble_card_reference.py --verify

      - name: Commit verified reference changes directly to main
        shell: bash
        run: |
          set -euo pipefail
          # Stage ONLY the mirrored reference, never application/module code.
          git add --all -- docs/upstream/bubble-card/
          if git diff --cached --quiet; then
            echo 'Bubble Card reference is already current; no commit necessary.'
            exit 0
          fi

          # Fail closed if a future change ever stages a file outside this directory.
          if git diff --cached --name-only | grep -Ev '^docs/upstream/bubble-card/'; then
            echo 'ERROR: Refusing to commit paths outside the upstream reference.' >&2
            exit 1
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: automatically sync verified Bubble Card upstream reference'

          # Fast-forward only. Conflicts must fail rather than overwrite changes.
          git push origin HEAD:main
