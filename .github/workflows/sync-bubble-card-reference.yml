name: Sync Bubble Card upstream reference

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bubble-card-upstream-reference
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test reference synchronizer
        run: python3 -m unittest discover -s tests -p 'test_bubble_card_reference.py' -v

      - name: Refresh stable and main snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_bubble_card_reference.py

      - name: Verify all mirrored Git blob hashes
        run: python3 scripts/sync_bubble_card_reference.py --verify

      - name: Open or update reference pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/upstream/bubble-card/**
          branch: automation/bubble-card-upstream
          base: main
          delete-branch: true
          commit-message: 'docs: sync Bubble Card upstream reference'
          title: 'docs: refresh Bubble Card upstream reference'
          body: |
            Daily, reproducible snapshots of the latest stable Bubble Card release
            and upstream main, including only relevant source changes.

            - Sources verified against exact upstream Git blob hashes
            - Separate stable/main commits and manifests
            - Updated stable/main comparison and change history
            - No modifications to runtime module code

            Review the upstream changes before merging.
