name: Validate Bubble Card reference tooling

on:
  pull_request:
    paths:
      - 'scripts/sync_bubble_card_reference.py'
      - 'tests/test_bubble_card_reference.py'
      - '.github/workflows/sync-bubble-card-reference.yml'
      - '.github/workflows/test-bubble-card-reference.yml'
      - 'docs/upstream/bubble-card/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_bubble_card_reference.py' -v

      - name: Compile Python
        run: python3 -m py_compile scripts/sync_bubble_card_reference.py

      - name: Verify tracked snapshots when present
        run: |
          if test -f docs/upstream/bubble-card/stable/manifest.json; then
            python3 scripts/sync_bubble_card_reference.py --verify
          else
            echo 'Bootstrap: first snapshot will be generated by sync workflow.'
          fi
