        # Icon Effects
    - type: expandable
      title: "Global Defaults"
      icon: "mdi:tune-variant"
      name: global_defaults
      schema:
        - name: badge_color
          label: "Global badge background color"
          selector:
            ui_color:
              include_none: true
        - name: badge_text_color
          label: "Global badge text color"
          selector:
            ui_color:
              include_none: true
        - name: badge_scale
          label: "Global badge scale (unless overridden)"
          default: 1
          selector:
            number:
              min: 0.5
              max: 3
              step: 0.1
              mode: slider
        - name: badge_h_pos
          label: "Global badge horizontal offset"
          default: -8
          selector:
            number:
              min: -100
              max: 100
              step: 1
              mode: slider
        - name: badge_v_pos
          label: "Global badge vertical offset"
          default: -8
          selector:
            number:
              min: -100
              max: 100
              step: 1
              mode: slider
        - name: icon_color
          label: "Global sub-button icon color"
          selector:
            ui_color:
              include_none: true
        - name: sub_button_effect
          label: "Global sub-button effect"
          default: "none"
          selector:
            select:
              options:
                - label: None
                  value: none
                - label: Pulse
                  value: pulse
                - label: Rotate
                  value: rotate
                - label: Glow
                  value: glow
                - label: Shake
                  value: shake
                - label: Float
                  value: float
                - label: Zoom
                  value: zoom
                - label: Heartbeat
                  value: heartbeat
                - label: Spin
                  value: spin-360
                - label: Flip
                  value: flip
                - label: Vibrate
                  value: vibrate
        - name: sub_button_effect_color
          label: "Global effect color"
          selector:
            ui_color:
              include_none: true
        - name: sub_button_background
          label: "Global sub-button background"
          selector:
            object:
              fields:
                type:
                  label: Background type
                  selector:
                    select:
                      options:
                        - label: Solid
                          value: solid
                        - label: Two-color gradient
                          value: two-color
                        - label: Three-color gradient
                          value: three-color
                color:
                  label: Solid color
                  selector:
                    ui_color: {}
                condition:
                  label: Condition
                  selector:
                    condition: {}
